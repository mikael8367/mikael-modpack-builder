name: CurseForge MCP checks

on:
  pull_request:
    paths:
      - "curseforge-mcp/**"
  push:
    branches:
      - main
    paths:
      - "curseforge-mcp/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curseforge-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: curseforge-mcp/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run check
      - run: npm test
